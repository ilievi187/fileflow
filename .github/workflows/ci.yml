name: FileFlow checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fileflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q file_organizer.py fileflow_qt.py ui_theme.py tests
      - name: Run organizer tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI help
        run: python file_organizer.py --help

  gui:
    name: Qt GUI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime
        run: python -m pip install PySide6
      - name: Verify GUI can start headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: python fileflow_qt.py --smoke
